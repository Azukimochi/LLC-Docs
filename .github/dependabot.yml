version: 2
updates:
  # npm パッケージ（毎週月曜にまとめて確認）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Docusaurus 関連は同じバージョンにそろえる必要があるため 1 つの PR にまとめる
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - "react"
          - "react-dom"
    ignore:
      # メジャーバージョンの更新は移行作業が必要なため手動で行う
      - dependency-name: "@docusaurus/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions（checkout・setup-node・Pages 用のアクションなど）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
